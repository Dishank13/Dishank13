<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .num { font-size: 30px; font-weight: 700; fill: #38BDF8; }
    .label { font-size: 13px; fill: #CBD5E1; }
    .sub { font-size: 11px; fill: #64748B; }
    .ring-bg { fill: none; stroke: #1E293B; stroke-width: 5; }
    .ring { fill: none; stroke: url(#g); stroke-width: 5; stroke-linecap: round;
            stroke-dasharray: 283; stroke-dashoffset: 283;
            animation: draw 1.6s ease-out forwards; }
    .fade { opacity: 0; animation: up 0.8s ease-out forwards; }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset: var(--end); } }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0"/><stop offset=".5" stop-color="#0EA5E9"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="840" height="220" rx="12" fill="#0D1117"/>
  <rect class="glow" x="120" y="0" width="600" height="2" fill="url(#line)"/>

  <!-- 1 -->
  <g transform="translate(105,82)">
    <circle class="ring-bg" r="45"/>
    <circle class="ring" r="45" transform="rotate(-90)" style="--end:40;animation-delay:.1s"/>
    <text class="num fade" text-anchor="middle" y="11" style="animation-delay:.3s">130K</text>
    <text class="label fade" text-anchor="middle" y="80" style="animation-delay:.5s">F1 race laps modelled</text>
    <text class="sub fade" text-anchor="middle" y="98" style="animation-delay:.6s">21 seasons of timing data</text>
  </g>
  <!-- 2 -->
  <g transform="translate(315,82)">
    <circle class="ring-bg" r="45"/>
    <circle class="ring" r="45" transform="rotate(-90)" style="--end:60;animation-delay:.35s"/>
    <text class="num fade" text-anchor="middle" y="11" style="animation-delay:.55s">3K+</text>
    <text class="label fade" text-anchor="middle" y="80" style="animation-delay:.75s">research papers indexed</text>
    <text class="sub fade" text-anchor="middle" y="98" style="animation-delay:.85s">hybrid retrieval + reranking</text>
  </g>
  <!-- 3 -->
  <g transform="translate(525,82)">
    <circle class="ring-bg" r="45"/>
    <circle class="ring" r="45" transform="rotate(-90)" style="--end:25;animation-delay:.6s"/>
    <text class="num fade" text-anchor="middle" y="11" style="animation-delay:.8s">72×</text>
    <text class="label fade" text-anchor="middle" y="80" style="animation-delay:1s">faster anomaly scoring</text>
    <text class="sub fade" text-anchor="middle" y="98" style="animation-delay:1.1s">vectorized up to 1M rows</text>
  </g>
  <!-- 4 -->
  <g transform="translate(735,82)">
    <circle class="ring-bg" r="45"/>
    <circle class="ring" r="45" transform="rotate(-90)" style="--end:70;animation-delay:.85s"/>
    <text class="num fade" text-anchor="middle" y="11" style="animation-delay:1.05s">200+</text>
    <text class="label fade" text-anchor="middle" y="80" style="animation-delay:1.25s">students at my workshops</text>
    <text class="sub fade" text-anchor="middle" y="98" style="animation-delay:1.35s">IEEE Computer Society</text>
  </g>
</svg>
